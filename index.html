<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gnana Satvika Regalla | Portfolio</title>
<meta name="description" content="Portfolio of Gnana Satvika Regalla, CSE (Data Science) student.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf9;--surface:#fff;--text:#16181d;--body:#2c303a;--muted:#5b616e;--line:#e4e4e7;--accent:#2f4bd8;--soft:#eef1fe;--chip:#2339a8;--r:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.04);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--surface:#171a20;--text:#f2f3f5;--body:#cfd3dc;--muted:#9aa1ae;--line:#2a2e37;--accent:#7f95ff;--soft:#1f2540;--chip:#b4c0ff}}
:root[data-theme="dark"]{--bg:#101216;--surface:#171a20;--text:#f2f3f5;--body:#cfd3dc;--muted:#9aa1ae;--line:#2a2e37;--accent:#7f95ff;--soft:#1f2540;--chip:#b4c0ff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;font:16px/1.65 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}.muted{color:var(--muted)}
.lead{font-size:1.15rem;color:var(--body);margin:16px 0 10px;max-width:56ch}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}.logo{font-weight:700;letter-spacing:.04em;text-decoration:none}
nav{display:flex;align-items:center;gap:26px}nav a:not(.btn){text-decoration:none;font-size:.92rem;color:var(--muted)}nav a:not(.btn):hover{color:var(--text)}
.burger{display:none;font:inherit;color:var(--text);background:none;border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
.btn{display:inline-flex;align-items:center;padding:10px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font:500 .92rem Inter,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--sh)}.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}[data-theme="dark"] .btn-p{color:#101216}.btn-s{padding:6px 14px;font-size:.85rem}
.hero{padding:88px 0 72px}.hero-in{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.eyebrow{font-size:.85rem;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
h1{font-size:clamp(2rem,4.6vw,3.2rem);line-height:1.12;letter-spacing:-.025em}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.editor{background:#14161c;border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.18);overflow:hidden}
.dots{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid #262a33}.dots i{width:9px;height:9px;border-radius:50%;background:#3a3f4b}.dots span{margin-left:10px;font:12px ui-monospace,monospace;color:#8b91a0}
.editor pre{margin:0;padding:20px;font:13.5px/1.8 ui-monospace,Menlo,monospace;color:#c9cfdc;overflow-x:auto}
.caret{display:inline-block;width:7px;height:15px;background:#8da2ff;vertical-align:middle;margin-left:2px;animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.section{padding:72px 0;border-top:1px solid var(--line)}h2{font-size:1.75rem;letter-spacing:-.02em;margin-bottom:32px}h3{font-size:1.05rem;line-height:1.35}
h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.about{max-width:68ch;display:grid;gap:16px;color:var(--body)}.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips li{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--chip);font-weight:500}
.proj{display:flex;flex-direction:column}.proj>p{margin-top:14px;color:var(--body);font-size:.95rem}.proj .actions{margin-top:auto;padding-top:22px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:.88rem;color:var(--body)}.feat li{padding-left:14px;position:relative}.feat li:before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.exp{margin-bottom:20px}.eh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-bottom:10px}.role{color:var(--accent);font-weight:600;font-size:.9rem}.exp p{color:var(--body);font-size:.95rem}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}.stats div{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 16px;display:grid}.stats strong{font-size:1.4rem;line-height:1.2}.stats span{font-size:.82rem;color:var(--muted)}
.edu li{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.yrs{color:var(--muted);font-size:.9rem;white-space:nowrap}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px}.cl li{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.cl span{width:80px;color:var(--muted);font-size:.9rem}.cl a{color:var(--accent);word-break:break-all;text-decoration:none}
.form{display:grid;gap:14px}label{display:grid;gap:6px;font-size:.88rem;font-weight:500}
input,textarea{font:inherit;color:var(--text);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.form .btn{justify-content:center}.note{font-size:.8rem;color:var(--muted)}
.footer{border-top:1px solid var(--line);padding:36px 0;font-size:.9rem}.footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}.fl{display:flex;gap:18px}.fl a{color:var(--accent);text-decoration:none}.copy{width:100%}
